<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="sml-256.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sementsul Network — Телеметрия SML</title>
<style>
body{font-family:monospace;background:#0e1117;color:#c9d1d9;padding:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#161b22;padding:25px;border:1px solid #30363d;border-radius:6px}
.number{font-size:1.6rem;color:#58a6ff;font-weight:bold;margin-top:10px;word-break:break-all}
.burn{color:#f85149}
.small{font-size:.8rem;color:#888}
</style>
</head>
<body>
<a href="stats.html"><img src="sml-256.png" alt="Sementsul (SML)" style="height:52px;border-radius:50%;box-shadow:0 0 18px rgba(88,166,255,.35)"></a>
<h1>Телеметрия сети SML (live)</h1>
<p class="small">IP-база: <a href="blocklist.txt">blocklist.txt</a> · телеметрия от оракула · обновление каждые 15 мин</p>
<div class="grid">
<div class="card"><h3>IP в базе</h3><div class="number" id="botCount">…</div></div>
<div class="card"><h3>Всего сожжено (totalBurned)</h3><div class="number burn" id="burned">…</div></div>
<div class="card"><h3>Резерв на контракте</h3><div class="number" id="reserve">…</div></div>
<div class="card"><h3>Год / лимит года</h3><div class="number" id="year">…</div></div>
</div>
<script>
// Телеметрию пишет оракул в telemetry.json (тот же домен — без CORS-проблем прямого RPC).
async function main(){
  const set = (id, v) => { document.getElementById(id).textContent = v; };
  try{
    const b = await (await fetch("blocklist.txt")).text();
    const n = b.split("\n").map(s=>s.trim()).filter(Boolean).length;
    set("botCount", n.toLocaleString("en-US"));
  }catch{ set("botCount", "—"); }
  try{
    const r = await fetch("telemetry.json");
    if (!r.ok) throw new Error("no telemetry yet");
    const d = await r.json();
    const f = v => (v == null ? "—" : Number(v).toLocaleString("en-US", {maximumFractionDigits: 1}) + " SML");
    set("burned", f(d.totalBurned));
    set("reserve", f(d.burnReserve));
    set("year", d.contractYear != null ? "год " + d.contractYear + " / 2.5M" : "—");
  }catch{ set("burned", "скоро"); set("reserve", "скоро"); set("year", "скоро"); }
}
main();
</script>
</body>
</html>
