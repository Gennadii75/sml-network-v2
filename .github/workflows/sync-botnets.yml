name: Sync Botnet Logs + Mint SML

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install ethers@6

      - name: Fetch D1 + mint via oracle
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BNB_RPC_URL: ${{ secrets.BNB_RPC_URL }}
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
        run: node scripts/oracle-sync.mjs

      - name: Rebuild public blocklist from D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$CF_D1_DATABASE_ID/query" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"sql": "SELECT DISTINCT ip FROM bot_logs ORDER BY last_seen DESC LIMIT 50000"}' \
            | python3 -c "
          import json, sys, re
          v4 = re.compile(r'^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$')
          def is_ip(s):
              if not isinstance(s, str): return False
              s = s.strip()
              if v4.match(s): return True
              return ':' in s and re.fullmatch(r'[0-9a-fA-F:]{3,45}', s) is not None
          d = json.load(sys.stdin)
          ips = set()
          try:
              for res in d.get('result', []):
                  for row in res.get('results', []):
                      ip = (row.get('ip') or '').strip()
                      if is_ip(ip): ips.add(ip)
          except Exception as e:
              print(f'parse error: {e}', file=sys.stderr)
          print('\n'.join(sorted(ips)))
          " > public/blocklist.txt
          wc -l public/blocklist.txt
          head -5 public/blocklist.txt

      - name: Commit blocklist
        run: |
          git config user.name "Sementsul Oracle Bot"
          git config user.email "oracle@sementsul.net"
          git add public/blocklist.txt public/telemetry.json
          # Без [skip ci]: этот пуш должен будить pages-деплой.
          # Пуш через PAT (иначе GITHUB_TOKEN не триггерит workflows).
          git diff-index --quiet HEAD || git commit -m "chore: update blocklist + telemetry"
          git remote set-url origin https://x-access-token:${{ secrets.PAT }}@github.com/Gennadii75/sml-network-v2.git
          git push origin HEAD || echo "nothing to push"
